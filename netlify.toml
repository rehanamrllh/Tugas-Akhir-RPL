[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "MIDTRANS_CLIENT_KEY"

[[redirects]]
  from = "/api/payment"
  to = "/.netlify/functions/payment"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
